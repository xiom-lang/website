#
# Versioned documentation site (docs.xiom-lang.org), built by
# docs/build_mkdocs.py into build/mkdocs-src/ and deployed with mike.
# The standalone bundle in docs/html/ stays as release packaging output.

site_name: XIOM Documentation
site_description: Language guide and standard library API reference for XIOM.
site_url: https://docs.xiom-lang.org/
docs_dir: build/mkdocs-src
site_dir: site
strict: true

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

validation:
  links:
    not_found: warn
    absolute_links: info
    anchors: warn

plugins:
  - literate-nav:
      nav_file: SUMMARY.md
