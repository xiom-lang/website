#
# Fails when the committed generated docs do not match docs/build_docs.py
# output, checks relative links across the published trees, and lints the
# XIOM code snippets for canonical syntax (contract colons, use semicolons,
# square-bracket generics).
# Run `python docs/build_docs.py` and commit the result to fix drift.
#
# Keep every action ref pinned to a full commit SHA: the xiom-lang org
# enforces sha_pinning_required=true and tag refs fail at job setup.

name: docs

on:
  push:
    paths:
      - "docs/**"
      - "xiom-website/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "xiom-website/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

jobs:
  generated-docs:
    name: generated docs are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Regenerate docs
        run: python docs/build_docs.py
      - name: Fail when committed output differs
        run: |
          if [ -n "$(git status --porcelain -- docs/html)" ]; then
            echo "::error::Generated docs are out of date. Run: python docs/build_docs.py"
            git status --porcelain -- docs/html
            git --no-pager diff --stat -- docs/html
            exit 1
          fi
      - name: Check relative links
        run: python docs/check_links.py docs/html xiom-website
      - name: Check XIOM snippet syntax
        run: python docs/check_syntax.py docs/language docs/AI_CONTEXT.md xiom-website
